<!doctype html>
<html lang="uz">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alisa bilan rus tili</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Russo+One&display=swap&subset=cyrillic,latin-ext">
<style>
/* Layout: school "kletka" notebook paper; ink-blue for the learner, red pen for the teacher's marks. */
:root{
  --bg:#f3f6fa; --grid:#dfe7f1; --card:#ffffff; --card2:#f7f9fc;
  --fg:#1a2233; --muted:#5a6680; --line:#d3dcea;
  --ink:#2343a0; --ink-soft:#e5ebfa; --red:#c4313a; --red-soft:#fbe9ea;
  --ok:#2b7a4b; --ok-soft:#e3f3e9; --gold:#b7791f;
  --f-display:"Russo One","PT Sans",system-ui,sans-serif;
  --f-body:"PT Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"PT Serif",Georgia,"Times New Roman",serif;
  --f-hand:"Neucha","Comic Sans MS","PT Sans",cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1524; --grid:#172238; --card:#141e31; --card2:#18243a;
  --fg:#e5eaf4; --muted:#97a3bd; --line:#26344f;
  --ink:#8db0ff; --ink-soft:#1c2c4d; --red:#ff7479; --red-soft:#3a1f27;
  --ok:#62cf8f; --ok-soft:#173326; --gold:#e8b456; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1524; --grid:#172238; --card:#141e31; --card2:#18243a;
  --fg:#e5eaf4; --muted:#97a3bd; --line:#26344f;
  --ink:#8db0ff; --ink-soft:#1c2c4d; --red:#ff7479; --red-soft:#3a1f27;
  --ok:#62cf8f; --ok-soft:#173326; --gold:#e8b456; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:var(--ink)}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);margin-right:auto}
.brand b{font:400 18px/1 var(--f-display);letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.logo{width:34px;height:34px;flex:none}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px}
nav.tabs a[aria-current="page"]{background:var(--ink-soft);color:var(--ink)}
nav.tabs a:hover{color:var(--ink)}
.badge-due{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}

main{padding-block:24px 64px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:15px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.pri:hover{filter:brightness(1.08);color:var(--card)}
.btn.sm{padding:5px 10px;font-size:13px}
.icon{width:18px;height:18px;flex:none}
.ibtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink)}
.ibtn:hover{background:var(--ink-soft)}
.ibtn.on{color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:28px}
.hero h1{font:400 clamp(30px,5vw,48px)/1.08 var(--f-display);color:var(--ink);margin:6px 0 12px}
.hero p{max-width:60ch;margin:0;color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:14px}
.stat b{display:block;font:400 28px/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.path{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:8px 0 32px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.path div{padding:12px 12px 14px;border-right:1px solid var(--line);min-width:0}
.path div:last-child{border-right:0}
.path b{font:400 20px var(--f-display);display:block}
.path span{font-size:13px;color:var(--muted);display:block;line-height:1.35}
.path .now{background:var(--ink-soft)}
.path .now b{color:var(--ink)}
h2.sec{font:400 22px/1.2 var(--f-display);margin:0 0 6px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:36px}
.lcard{display:flex;flex-direction:column;gap:8px;padding:16px;text-decoration:none;color:var(--fg);position:relative;transition:border-color .15s,transform .15s}
.lcard:hover{border-color:var(--ink);transform:translateY(-2px)}
.lcard .n{font:400 30px/1 var(--f-display);color:var(--ink)}
.lcard h3{font:700 19px/1.25 var(--f-read)}
.lcard .uz{font-size:14px;color:var(--muted)}
.lcard .tp{font-size:13px;padding:3px 8px;border-radius:6px;background:var(--card2);border:1px solid var(--line);align-self:flex-start}
.lcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px;font-size:12px;color:var(--muted)}
.pips{display:flex;gap:3px}
.pips i{width:14px;height:5px;border-radius:3px;background:var(--line)}
.pips i.d{background:var(--ok)}
.mark{position:absolute;top:12px;right:14px;font:22px/1 var(--f-hand);color:var(--red);transform:rotate(-8deg)}
details.book{margin-bottom:10px}
details.book summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
details.book summary::-webkit-details-marker{display:none}
details.book summary .lv{font:400 14px var(--f-display);padding:3px 8px;border-radius:6px;background:var(--ink-soft);color:var(--ink)}
details.book summary .t{font:700 17px var(--f-read)}
details.book summary .c{margin-left:auto;font-size:13px;color:var(--muted)}
.chlist{padding:0 16px 16px;columns:2 260px;column-gap:24px;font-size:14px}
.chlist .pt{font-weight:700;color:var(--muted);margin:10px 0 4px;break-after:avoid}
.chlist ol{margin:0;padding-left:22px}
.chlist li{break-inside:avoid;padding:1px 0}
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:28px}
.method div{padding:14px}
.method b{display:block;margin-bottom:4px}
.method p{margin:0;font-size:14px;color:var(--muted)}

/* lesson */
.crumb{font-size:14px;margin-bottom:10px;display:inline-flex;gap:6px;align-items:center}
.lhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start;margin-bottom:18px}
.lhead .big{font:400 64px/0.9 var(--f-display);color:var(--ink)}
.lhead h1{font:700 clamp(26px,4vw,36px)/1.15 var(--f-read);margin:4px 0}
.lhead .sub{color:var(--muted);font-size:17px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.chip.lv{color:var(--ink);border-color:var(--ink)}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:start}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:2px;padding:8px}
.steps button{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 10px;border-radius:8px;border:0;background:transparent;cursor:pointer;font-weight:700;color:var(--muted);font-size:15px}
.steps button .k{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.steps button[aria-current="step"]{background:var(--ink-soft);color:var(--ink)}
.steps button[aria-current="step"] .k{border-color:var(--ink)}
.steps button.d .k{background:var(--ok);border-color:var(--ok);color:var(--card)}
.panel{padding:22px;min-width:0}
.panel h2{font:400 22px/1.2 var(--f-display);margin-bottom:12px}
.panel h3{font-size:17px;margin:22px 0 10px}
.lede{font-size:17px;max-width:65ch}
ul.can{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ul.can li{display:flex;gap:10px;align-items:flex-start}
ul.can input{width:18px;height:18px;margin-top:3px;accent-color:var(--ok);flex:none}
.note{padding:14px 16px;border-radius:var(--r);background:var(--card2);border:1px dashed var(--line);font-size:15px}
.note b{color:var(--fg)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}

/* vocab */
.vtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.vitem{display:flex;gap:6px;align-items:flex-start;padding:10px 8px 10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.vitem .tx{flex:1;min-width:0}
.vitem .ru{font:700 17px/1.3 var(--f-read)}
.vitem .uz{font-size:14px;color:var(--muted)}
.vitem .ex{font:italic 14px/1.4 var(--f-read);color:var(--ink);margin-top:3px}
.vitem .tag{font-size:11px;color:var(--muted);margin-top:2px}

/* grammar */
.gintro{max-width:68ch;font-size:16.5px}
.tbl{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:15px;background:var(--card)}
.tbl caption{text-align:left;padding:8px 12px;font-weight:700;color:var(--muted);font-size:13px;letter-spacing:.04em;text-transform:uppercase;caption-side:top;background:var(--card2);border-bottom:1px solid var(--line)}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:13px;color:var(--muted);background:var(--card2)}
.tbl td{font-family:var(--f-read)}
.tbl td b{color:var(--red)}
.tbl tr:last-child td{border-bottom:0}
ul.pts{padding-left:20px;max-width:70ch;display:grid;gap:6px;margin:0}
.usage{display:grid;gap:8px}
.ux{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:10px 12px;border-left:3px solid var(--ink);background:var(--card2);border-radius:0 8px 8px 0}
.ux .ru{font:17px/1.4 var(--f-read)}
.ux .ru b{color:var(--ink);background:var(--ink-soft);padding:0 3px;border-radius:3px}
.ux .uz{font-size:14px;color:var(--muted);grid-column:2}
.ux .why{font:15px var(--f-hand);color:var(--red);grid-column:2}

/* reading */
.rtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sheet{position:relative;padding:22px 22px 22px 46px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  background-image:linear-gradient(90deg,transparent 30px,var(--red) 30px,var(--red) 31px,transparent 31px)}
.sheet p{font:18.5px/1.75 var(--f-read);margin:0 0 .9em;max-width:66ch}
.sheet p.dlg{padding-left:0}
.w{font:inherit;background:none;border:0;padding:0;cursor:pointer;color:inherit;border-bottom:1.5px dotted transparent;border-radius:2px}
.hl .w{border-bottom-color:var(--ink);color:var(--ink)}
.w:hover,.w.act{background:var(--ink-soft);color:var(--ink)}
.w.fz{border-bottom-style:dashed}
.w.un{border-bottom-color:transparent;color:inherit}
.hl .w.un{color:inherit;border-bottom-color:transparent}
.src{font-size:14px;margin-top:12px}

/* popover */
.pop{position:fixed;z-index:50;width:min(320px,calc(100vw - 32px));padding:14px 14px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(10,20,40,.18)}
.pop .ru{font:700 22px/1.25 var(--f-read);color:var(--ink);padding-right:30px}
.pop .form{font-size:13px;color:var(--muted)}
.pop .uz{font-size:16px;margin-top:4px}
.pop .ex{font:italic 15px var(--f-read);color:var(--muted);margin-top:6px}
.pop .x{position:absolute;top:8px;right:8px}
.pop .row{margin-top:10px}

/* exercises */
.qlist{display:grid;gap:10px;counter-reset:q}
.q{padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--card);counter-increment:q}
.q .qt{font:18px/1.5 var(--f-read);display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.q .qt::before{content:counter(q) ".";font:700 14px var(--f-body);color:var(--muted)}
.q .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.opt{padding:7px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--card2);cursor:pointer;font:16px var(--f-read)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}
.gap{font:18px var(--f-read);border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);width:9.5em;max-width:100%;padding:0 4px;text-align:center}
.gap:focus{outline:none;background:var(--ink-soft)}
.gap.right{border-color:var(--ok);color:var(--ok)}
.gap.wrong{border-color:var(--red);color:var(--red)}
.fb{margin-top:8px;font:17px var(--f-hand);color:var(--red)}
.fb.ok{color:var(--ok)}
.score{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.score .val{font:30px/1 var(--f-hand);color:var(--red);transform:rotate(-4deg);display:inline-block}
.bar{flex:1;min-width:120px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}

.match{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:620px}
.match button{padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;text-align:left;min-height:46px}
.match .l{font:700 17px var(--f-read)}
.match button.sel{border-color:var(--ink);background:var(--ink-soft)}
.match button.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default}
.match button.bad{border-color:var(--red);background:var(--red-soft)}

/* flashcards */
.fc-wrap{max-width:560px;margin:0 auto}
.fc{perspective:1200px;height:240px;cursor:pointer;margin:12px 0}
.fc-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.fc-face.back{transform:rotateY(180deg);background:var(--card2)}
.fc-face .main{font:700 30px/1.25 var(--f-read);color:var(--ink)}
.fc-face .hint{font-size:13px;color:var(--muted)}
.fc-face .ex{font:italic 16px var(--f-read);color:var(--muted)}
.fc-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc-btns .btn{justify-content:center;padding:12px}
.btn.no{border-color:var(--red);color:var(--red)}
.btn.yes{border-color:var(--ok);color:var(--ok)}
.boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:14px 0}
.boxes div{padding:8px;border:1px solid var(--line);border-radius:8px;text-align:center;background:var(--card)}
.boxes b{display:block;font:400 20px var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.boxes span{font-size:11px;color:var(--muted)}

/* dictionary table */
.dtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.inp{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:15px var(--f-body);min-width:0}
.inp.grow{flex:1 1 220px}
textarea.inp{width:100%;min-height:150px;font:17px/1.6 var(--f-read);resize:vertical}
.dict{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.dict table{border-collapse:collapse;width:100%}
.dict td,.dict th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:15px;vertical-align:middle}
.dict th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--card2);position:sticky;top:0}
.dict td.r{font:700 16px var(--f-read)}
.dict td.t{font-size:12px;color:var(--muted);white-space:nowrap}
.dict tr:last-child td{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--muted)}
pre.sample{white-space:pre-wrap;font:16px/1.6 var(--f-read);margin:10px 0 0;padding:14px;border-radius:8px;background:var(--card2);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .layout{grid-template-columns:1fr}
  .steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5;flex-direction:row;overflow-x:auto;padding:6px;background:var(--card)}
  .steps button{white-space:nowrap;padding:7px 9px;font-size:14px}
  .path{grid-template-columns:repeat(5,minmax(120px,1fr));overflow-x:auto}
  .top .wrap{gap:8px}
  .brand small{display:none}
}
@media (max-width:520px){
  .panel{padding:16px}
  .sheet{padding:16px 14px 16px 34px;background-image:linear-gradient(90deg,transparent 22px,var(--red) 22px,var(--red) 23px,transparent 23px)}
  .sheet p{font-size:17.5px}
  .lhead .big{font-size:46px}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat b{font-size:22px}
  .match{grid-template-columns:1fr 1fr}
  nav.tabs a{padding:6px 9px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  </a>
  <nav class="tabs" id="nav">
    <a href="#kurs" data-r="kurs">Kurs</a>

const H = s => bold(mix(s));              // trusted HTML from data
const plain = s => String(s).replace(/'/g, "").replace(/́/g, "");

const keysOf = ru => ru.replace(/\([^)]*\)/g, "").split("/").map(norm).filter(Boolean);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- state (per-viewer, browser only) ---------- */
const KEY = "alisa-ru-v1";
let S = { done: {}, score: {}, star: {}, srs: {}, cando: {}, dir: "ru" };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
const save = () => { S.ts = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} updateBadge(); if (window.__onSave) window.__onSave(); };

/* ---------- dictionary index ---------- */
const DICT = new Map();   // key -> {ru, uz, ex, lesson}
const ENTRIES = [];       // unique entries for "Lug'atim"
const FORMS = new Map();  // normalized form -> key
LESSONS.forEach(l => l.vocab.forEach(v => {
  const e = { ru: v[0], uz: v[1], ex: v[2] || "", lesson: l.id, num: l.num, id: norm(v[0]) };
  const ks = keysOf(v[0]);
  e.key = ks[ks.length - 1] || e.id;
  let fresh = false;
  ks.forEach(k => { if (!DICT.has(k)) { DICT.set(k, e); fresh = true; } });
  if (fresh && !ENTRIES.some(x => x.id === e.id)) ENTRIES.push(e);
}));
LESSONS.forEach(l => {
  const re = /\{([^}|]+)(?:\|([^}]+))?\}/g; let m;
  while ((m = re.exec(l.reading))) { const f = norm(m[1]), k = norm(m[2] || m[1]); if (!FORMS.has(f)) FORMS.set(f, k); }
});
const STEMS = new Map();
const END = /(ться|тся|ть|ти|чь|ся|ый|ий|ой|ая|яя|ое|ее|ые|ие|ов|ев|ей|ам|ям|ах|ях|ом|ем|ую|юю|а|я|о|е|ь|ы|и|у|ю|й)$/;
DICT.forEach((e, k) => { if (k.includes(" ")) return; const st = k.replace(END, ""); if (st.length >= 3 && !STEMS.has(st)) STEMS.set(st, k); });
function lookup(word) {
  const n = norm(word);
  if (FORMS.has(n)) return { key: FORMS.get(n), fuzzy: false };
  if (DICT.has(n)) return { key: n, fuzzy: false };
  let w = n;
  for (let i = 0; i < 3 && w.length > 3; i++) {
    const st = w.replace(END, "");
    if (st === w) break;
    if (STEMS.has(st)) return { key: STEMS.get(st), fuzzy: true };
    w = st;
  }
  if (STEMS.has(n)) return { key: STEMS.get(n), fuzzy: true };
  return null;
}
const entryOf = k => DICT.get(k);

/* ---------- speech ---------- */
let ruVoice = null;
function pickVoice() {
  try { const vs = speechSynthesis.getVoices(); ruVoice = vs.find(v => /^ru/i.test(v.lang)) || null; } catch (e) {}
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate, quiet) {
  if (!("speechSynthesis" in window)) { if (window.__noVoice) window.__noVoice(); else toast("Brauzeringiz ovozli o'qishni qo'llamaydi"); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(plain(text).replace(/\*\*/g, "").replace(/\(.*?\)/g, ""));
    u.lang = "ru-RU"; if (ruVoice) u.voice = ruVoice; u.rate = rate || 0.9;
    speechSynthesis.speak(u);
    if (!ruVoice && !quiet) toast("Rus ovozi topilmadi — qurilma sozlamalaridan rus tilini o'rnating");
  } catch (e) { toast("Ovoz ishlamadi"); }
}

  }

}
function hidePop() { pop.hidden = true; $$(".w.act").forEach(x => x.classList.remove("act")); popAnchor = null; }

function toggleStar(id) { if (S.star[id]) delete S.star[id]; else S.star[id] = 1; save(); toast(S.star[id] ? "Lug'atimga saqlandi" : "Saqlanganlardan olib tashlandi"); }

/* ---------- SRS (Leitner) ---------- */
const DAY = 864e5, GAP = [0, 0, 1, 3, 7, 16];
const now = () => Date.now();
function dueList(filter) {
  const pool = ENTRIES.filter(filter || (() => true));
  const due = pool.filter(e => S.srs[e.id] && S.srs[e.id].d <= now());
  const fresh = pool.filter(e => !S.srs[e.id]);
  return shuffle(due).concat(fresh.slice(0, Math.max(0, 15 - due.length)));
}
function grade(id, ok) {
  const c = S.srs[id] || { b: 0 };
  c.b = ok ? Math.min(5, (c.b || 0) + 1) : 1;
  c.d = now() + GAP[c.b] * DAY - (ok ? 0 : 0);
  S.srs[id] = c; save();
}
function updateBadge() {
  const n = ENTRIES.filter(e => S.srs[e.id] && S.srs[e.id].d <= now()).length;
  const b = $("#dueBadge"); b.textContent = n; b.hidden = !n;
}

function readingHTML(text) {
  return text.split(/\n\n+/).map(par => {
    let out = "", last = 0; const re = /\{([^}|]+)(?:\|([^}]+))?\}/g; let m;
    while ((m = re.exec(par))) {
      out += mix(esc(par.slice(last, m.index)));
      out += `<button class="w" data-k="${esc(norm(m[2] || m[1]))}">${mix(esc(m[1]))}</button>`;
      last = re.lastIndex;
    }
    out += mix(esc(par.slice(last)));
    return `<p class="${/^—/.test(par) ? "dlg" : ""}">${out}</p>`;
  }).join("");
}

/* ---------- quiz engine ---------- */
const normAns = s => norm(s).replace(/[^а-яa-z\s-]/g, "").trim();
function quiz(host, L, items, slot) {
  const state = items.map(() => null);
  const draw = () => {
    const done = state.filter(x => x !== null).length, ok = state.filter(x => x === true).length;
    host.innerHTML = `<div class="score"><span class="val">${ok}/${items.length}</span><div class="bar"><i style="width:${items.length ? done / items.length * 100 : 0}%"></i></div>
      <button class="btn sm" data-reset>${mix("Qayta boshlash")}</button></div>
      <div class="qlist">${items.map((it, i) => qHTML(it, i, state[i])).join("")}</div>`;
    $("[data-reset]", host).onclick = () => { state.fill(null); draw(); };
    $$(".q", host).forEach((q, i) => {
      const it = items[i];
      if (state[i] !== null) return;
      $$(".opt", q).forEach(b => b.onclick = () => { state[i] = +b.dataset.v === answerIndex(it); record(); draw(); });
      const inp = $(".gap", q);
      if (inp) {
        const go = () => { if (!inp.value.trim()) return; state[i] = it.a.some(a => normAns(a) === normAns(inp.value)); q.dataset.val = inp.value; inputs[i] = inp.value; record(); draw(); };
        inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
        $(".chk", q).onclick = go;
      }
    });
  };
  const inputs = {};
  const answerIndex = it => it.t === "tf" ? (it.a ? 0 : 1) : it.a;
  const qHTML = (it, i, st) => {
    let body = "", fb = "";
    if (it.t === "gap") {
      const parts = esc(it.q).split("___");
      const cls = st === null ? "" : st ? "right" : "wrong";
      body = `<div class="qt"><span>${parts[0]}<input class="gap ${cls}" aria-label="Javob" autocomplete="off" autocapitalize="off" spellcheck="false" ${st !== null ? `value="${esc(inputs[i] || "")}" disabled` : ""}>${mix(parts[1] || "")}</span></div>
        ${st === null ? `<div class="opts"><button class="btn sm chk">${mix("Tekshirish")}</button></div>` : ""}`;
      if (st !== null) fb = st ? mix("To'g'ri!") : mix("To'g'ri javob: ") + esc(it.a[0]);
    } else {
      const opts = it.t === "tf" ? ["Верно", "Неверно"] : it.o;
      const q = it.t === "tf" ? it.s : it.q;
      const ai = answerIndex(it);
      body = `<div class="qt"><span>${esc(q)}</span></div><div class="opts">${opts.map((o, j) => {
        let c = ""; if (st !== null) { if (j === ai) c = "right"; else if (j === (it._pick)) c = "wrong"; }
        return `<button class="opt ${c}" data-v="${j}" ${st !== null ? "disabled" : ""}>${esc(o)}${it.t === "tf" ? ` <span class="muted" style="font-size:13px">(${mix(j ? "noto'g'ri" : "to'g'ri")})</span>` : ""}</button>`;
      }).join("")}</div>`;
      if (st !== null) fb = st ? mix("To'g'ri!") : mix("Xato.");
    }
    if (st !== null && it.ex) fb += " " + mix(it.ex);
    return `<div class="q">${body}${st !== null ? `<div class="fb ${st ? "ok" : ""}">${fb}</div>` : ""}</div>`;
  };
  // remember wrong pick for mc
  host.addEventListener("click", e => { const b = e.target.closest(".opt"); if (!b || b.disabled) return; const i = $$(".q", host).indexOf(b.closest(".q")); if (i >= 0) items[i]._pick = +b.dataset.v; }, true);
  const record = () => {
    const done = state.filter(x => x !== null).length;
    if (done === items.length) {
      const sc = S.score[L.id] || (S.score[L.id] = {});
      sc[slot] = Math.max(sc[slot] || 0, state.filter(Boolean).length / items.length);
      save();
      if (slot === "q") markDone(L.id, 3);
      if (slot === "ex") markDone(L.id, 4);
    }
  };
  draw();
}

function matchGame(host, pool) {
  const set = shuffle(pool).slice(0, 6);
  const right = shuffle(set);
  let sel = null, solved = 0;
  host.innerHTML = `<div class="match">${set.map((e, i) => `<button class="l" data-i="${i}">${T(e.ru.replace(/\s*\(.*?\)/g, ""))}</button><button class="r" data-j="${set.indexOf(right[i])}">${T(right[i].uz)}</button>`).join("")}</div>
  <div class="row" style="margin-top:10px"><button class="btn sm" id="mNew">${mix("Yangi to'plam")}</button><span class="muted" id="mMsg"></span></div>`;
  // reorder: lefts in col1, rights in col2 (grid auto-flow already pairs l/r per row)
  $$(".l", host).forEach(b => b.onclick = () => { if (b.classList.contains("ok")) return; $$(".l.sel", host).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = b; });
  $$(".r", host).forEach(b => b.onclick = () => {
    if (!sel || b.classList.contains("ok")) return;
    if (sel.dataset.i === b.dataset.j) { sel.classList.remove("sel"); sel.classList.add("ok"); b.classList.add("ok"); speak(plain(set[+b.dataset.j].ru)); sel = null; solved++;
      if (solved === set.length) $("#mMsg", host).textContent = mix("Barakalla! Hammasi to'g'ri.");
    } else { b.classList.add("bad"); setTimeout(() => b.classList.remove("bad"), 450); }
  });
  $("#mNew", host).onclick = () => matchGame(host, pool);
}

function flashcards(host, cards, practiceOnly, onEnd) {
  let i = 0, known = 0;
  const dir = () => S.dir || "ru";
  const draw = () => {
    if (i >= cards.length) {
      host.innerHTML = `<div class="fc-wrap"><div class="card empty"><div style="font:32px var(--f-hand);color:var(--red)">${known}/${cards.length}</div>${mix("Bu to'plam tugadi. Barakalla!")}<div class="row" style="justify-content:center;margin-top:12px"><button class="btn sm" id="again">${mix("Yana bir bor")}</button></div></div></div>`;
      $("#again", host).onclick = () => { i = 0; known = 0; cards = shuffle(cards); draw(); };
      if (onEnd) onEnd();
      return;
    }
    const e = cards[i], ru = dir() === "ru";
    host.innerHTML = `<div class="fc-wrap">
      <div class="row" style="justify-content:space-between"><span class="muted">${i + 1} / ${cards.length}</span>
      <button class="btn sm" id="dirBtn">${mix(ru ? "Ruscha → o'zbekcha" : "O'zbekcha → ruscha")}</button></div>
      <div class="fc" id="card" tabindex="0" role="button" aria-label="Kartochkani aylantirish"><div class="fc-in">
        <div class="fc-face"><div class="main">${T(ru ? e.ru : e.uz)}</div><div class="hint">${mix("Bosing — javobni ko'rish")}</div></div>
        <div class="fc-face back"><div class="main">${T(ru ? e.uz : e.ru)}</div>${e.ex ? `<div class="ex">${T(e.ex)}</div>` : ""}</div>
      </div></div>
      <div class="fc-btns"><button class="btn no" id="no">${mix("Bilmadim")}</button><button class="btn yes" id="yes">${mix("Bildim")}</button></div></div>`;
    const card = $("#card", host);
    const flip = () => { card.classList.toggle("flip"); if (card.classList.contains("flip") || ru === false) speak(plain(e.ru)); };
    card.onclick = flip; card.onkeydown = ev => { if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); flip(); } };
    if (ru) speak(plain(e.ru), 0.9, true);
    $("#dirBtn", host).onclick = () => { S.dir = ru ? "uz" : "ru"; save(); draw(); };
    $("#no", host).onclick = () => { grade(e.id, false); i++; draw(); };
    $("#yes", host).onclick = () => { grade(e.id, true); known++; i++; draw(); };
  };
  draw();
}

  };

  // Natijalarni Telegram bulutida saqlash (barcha qurilmalarda bir xil)
  if (!tg.CloudStorage || !(tg.isVersionAtLeast && tg.isVersionAtLeast("6.9"))) return;
  var CS = tg.CloudStorage, P = "s", timer = null, oldN = 0;
  function push() {
    var str = JSON.stringify(S), parts = str.match(/[\s\S]{1,3500}/g) || [""];
    parts.forEach(function (p, i) { CS.setItem(P + i, p); });
    for (var i = parts.length; i < oldN; i++) CS.removeItem(P + i);
    oldN = parts.length; CS.setItem(P + "n", String(parts.length));
  }
  window.__onSave = function () { clearTimeout(timer); timer = setTimeout(push, 1200); };
  CS.getItem(P + "n", function (err, n) {
    n = parseInt(n || "0", 10); oldN = n;
    if (err || !n) { if (S.ts) push(); return; }
    var keys = []; for (var i = 0; i < n; i++) keys.push(P + i);
    CS.getItems(keys, function (e2, vals) {
      if (e2 || !vals) return;
      try {
        var c = JSON.parse(keys.map(function (k) { return vals[k] || ""; }).join(""));
        if ((c.ts || 0) > (S.ts || 0)) {
          Object.keys(c).forEach(function (k) { S[k] = c[k]; });
          try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
          updateBadge(); route();
        } else if ((S.ts || 0) > (c.ts || 0)) push();
      } catch (e) {}
    });
  });
})();
updateBadge();
route();
})();

</script>
